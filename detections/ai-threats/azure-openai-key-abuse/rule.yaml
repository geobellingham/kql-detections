id: d300307a-95ee-4b11-be31-7a7f9d6ef730
name: Azure OpenAI / Foundry key theft, guardrail tampering or request spike from new sources
description: |
  Combines control-plane and data-plane signals for each Azure OpenAI (Cognitive Services) account:
  API keys listed or regenerated by an identity that hasn't done so before, content-filter (RAI) policies
  or blocklists changed or deleted, and a spike in model requests coming from IP ranges the resource has
  never served. Together they describe the Azure side of LLMjacking: steal the key, loosen the guardrails,
  burn the quota.
severity: Medium
requiredDataConnectors:
  - connectorId: AzureActivity
    dataTypes:
      - AzureActivity
  - connectorId: AzureDiagnostics
    dataTypes:
      - AzureDiagnostics
queryFrequency: 1h
queryPeriod: 14d
triggerOperator: gt
triggerThreshold: 0
tactics:
  - CredentialAccess
  - DefenseEvasion
  - Impact
relevantTechniques:
  - T1552.005
  - T1562
  - T1496
query: |
  let lookback       = 1h;
  let keyWindow      = 1d;       // a key read this long before a spike still counts
  let baselineDays   = 13d;
  let spikeFactor    = 5.0;      // requests this hour vs the resource's busiest baseline hour
  let minRequests    = 200;
  let scoreThreshold = 4;
  // Identities (UPNs or app IDs as they appear in AzureActivity.Caller) that legitimately read keys
  let approvedKeyReaders = dynamic([]);
  let keyOps = dynamic(["MICROSOFT.COGNITIVESERVICES/ACCOUNTS/LISTKEYS/ACTION",
                        "MICROSOFT.COGNITIVESERVICES/ACCOUNTS/REGENERATEKEY/ACTION"]);
  let guardrailOps = dynamic(["MICROSOFT.COGNITIVESERVICES/ACCOUNTS/RAIPOLICIES/WRITE",
                              "MICROSOFT.COGNITIVESERVICES/ACCOUNTS/RAIPOLICIES/DELETE",
                              "MICROSOFT.COGNITIVESERVICES/ACCOUNTS/RAIBLOCKLISTS/DELETE",
                              "MICROSOFT.COGNITIVESERVICES/ACCOUNTS/RAIBLOCKLISTS/DELETERAIBLOCKLISTITEMS/ACTION"]);
  let accountRegex = @"^(/subscriptions/[^/]+/resourcegroups/[^/]+/providers/microsoft\.cognitiveservices/accounts/[^/]+)";
  // ---- control plane ----
  let activity = AzureActivity
      | where TimeGenerated > ago(baselineDays + keyWindow)
      | where OperationNameValue in~ (keyOps) or OperationNameValue in~ (guardrailOps)
      | where ActivityStatusValue in~ ("Success", "Succeeded")
      | extend Account = extract(accountRegex, 1, tolower(_ResourceId));
  let keyReads = activity
      | where OperationNameValue in~ (keyOps)
      | summarize RecentKeyReaders = make_set_if(Caller, TimeGenerated > ago(keyWindow), 10),
                  KnownKeyReaders = make_set_if(Caller, TimeGenerated <= ago(keyWindow), 100),
                  KeyReaderIPs = make_set_if(CallerIpAddress, TimeGenerated > ago(keyWindow), 10),
                  Regenerated = countif(OperationNameValue has "REGENERATEKEY" and TimeGenerated > ago(keyWindow))
                  by Account
      | extend NewKeyReaders = set_difference(set_difference(RecentKeyReaders, KnownKeyReaders), approvedKeyReaders);
  let guardrail = activity
      | where OperationNameValue in~ (guardrailOps) and TimeGenerated > ago(lookback)
      | summarize GuardrailOps = make_set(OperationNameValue, 5),
                  GuardrailCallers = make_set(Caller, 5),
                  GuardrailIPs = make_set(CallerIpAddress, 5)
                  by Account;
  // ---- data plane (Diagnostic setting -> RequestResponse logs) ----
  // CallerIPAddress can be partially masked (last octet), so compare /24 prefixes
  let requests = AzureDiagnostics
      | where TimeGenerated > ago(baselineDays + lookback)
      | where ResourceProvider == "MICROSOFT.COGNITIVESERVICES" and Category == "RequestResponse"
      | extend Account = extract(accountRegex, 1, tolower(_ResourceId)),
               IpPrefix = extract(@"^(\d{1,3}\.\d{1,3}\.\d{1,3})\.", 1, CallerIPAddress),
               IsRecent = TimeGenerated > ago(lookback);
  let baselineReq = requests
      | where not(IsRecent)
      | summarize HourRequests = count() by Account, Hour = bin(TimeGenerated, 1h)
      | summarize BaselineMaxHour = max(HourRequests), BaselineAvgHour = avg(HourRequests) by Account;
  let knownPrefixes = requests
      | where not(IsRecent) and isnotempty(IpPrefix)
      | summarize KnownPrefixes = make_set(IpPrefix, 5000) by Account;
  let recentReq = requests
      | where IsRecent
      | summarize Requests = count(),
                  ClientErrors = countif(ResultSignature startswith "4"),
                  Prefixes = make_set_if(IpPrefix, isnotempty(IpPrefix), 100),
                  RequestOps = make_set(OperationName, 10)
                  by Account;
  // ---- combine per account ----
  union (keyReads | project Account), (guardrail | project Account), (recentReq | project Account)
  | where isnotempty(Account)
  | distinct Account
  | join kind=leftouter keyReads      on Account
  | join kind=leftouter guardrail     on Account
  | join kind=leftouter recentReq     on Account
  | join kind=leftouter baselineReq   on Account
  | join kind=leftouter knownPrefixes on Account
  | extend Requests = coalesce(Requests, 0),
           BaselineMaxHour = coalesce(BaselineMaxHour, 0),
           KnownPrefixes = iff(isnull(KnownPrefixes), dynamic([]), KnownPrefixes),
           Prefixes = iff(isnull(Prefixes), dynamic([]), Prefixes)
  | extend NewPrefixes = set_difference(Prefixes, KnownPrefixes)
  | extend KeyReadByNewIdentity = coalesce(array_length(NewKeyReaders), 0) > 0,
           GuardrailWeakened    = coalesce(array_length(GuardrailOps), 0) > 0,
           RequestSpike         = Requests >= minRequests and Requests > spikeFactor * BaselineMaxHour,
           NewSourceRanges      = array_length(NewPrefixes) > 0 and array_length(KnownPrefixes) > 0,
           KeyRegenerated       = coalesce(Regenerated, 0) > 0,
           AuthFailuresNew      = coalesce(ClientErrors, 0) >= 50 and array_length(NewPrefixes) > 0
  | extend Score = 4 * toint(GuardrailWeakened) + 2 * toint(KeyReadByNewIdentity) + 2 * toint(RequestSpike)
                 + 2 * toint(NewSourceRanges) + 1 * toint(KeyRegenerated) + 1 * toint(AuthFailuresNew)
  | extend Reasons = strcat_array(array_concat(
        iff(GuardrailWeakened,    dynamic(["Content filter / blocklist changed or deleted"]), dynamic([])),
        iff(KeyReadByNewIdentity, dynamic(["Keys read by an identity not seen before"]), dynamic([])),
        iff(RequestSpike,         dynamic(["Request spike vs busiest baseline hour"]), dynamic([])),
        iff(NewSourceRanges,      dynamic(["Requests from never-seen IP ranges"]), dynamic([])),
        iff(KeyRegenerated,       dynamic(["Key regenerated"]), dynamic([])),
        iff(AuthFailuresNew,      dynamic(["Many 4xx from new ranges (key testing)"]), dynamic([]))), " | ")
  | where Score >= scoreThreshold
  | extend AlertSeverity = iff(GuardrailWeakened and (RequestSpike or KeyReadByNewIdentity), "High", "Medium"),
           AccountName = tostring(split(Account, "/")[-1]),
           FirstActor = coalesce(tostring(GuardrailCallers[0]), tostring(NewKeyReaders[0]))
  | project AlertSeverity, Score, Reasons, AccountName, Account, Requests, BaselineMaxHour, BaselineAvgHour, NewPrefixes,
            NewKeyReaders, KeyReaderIPs, GuardrailOps, GuardrailCallers, GuardrailIPs, FirstActor, ClientErrors, RequestOps
entityMappings:
  - entityType: AzureResource
    fieldMappings:
      - identifier: ResourceId
        columnName: Account
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: FirstActor
customDetails:
  Score: Score
  Reasons: Reasons
alertDetailsOverride:
  alertDisplayNameFormat: "Azure OpenAI abuse signals on {{AccountName}} (score {{Score}})"
  alertDescriptionFormat: "Reasons: {{Reasons}}"
  alertSeverityColumnName: AlertSeverity
version: 1.0.0
kind: Scheduled
