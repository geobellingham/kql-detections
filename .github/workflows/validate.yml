name: Validate detections

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci --prefix tools
      - name: Parse and bind every query (rules, hunting, test fixtures)
        run: node tools/validate.js
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Regex unit tests
        run: python3 tests/regex_test.py

  fixtures:
    runs-on: ubuntu-latest
    services:
      kusto:
        image: mcr.microsoft.com/azuredataexplorer/kustainer-linux:latest
        env:
          ACCEPT_EULA: "Y"
        ports:
          - 8080:8080
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci --prefix tools
      - name: Run every detection on its sample data (Kusto emulator)
        run: node tools/run-fixtures.js
